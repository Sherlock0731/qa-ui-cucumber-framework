# Default configuration properties

# Environment
env=local

# Application URLs
saucedemo.base.url=https://www.saucedemo.com

# User credentials
user.standard.username=standard_user
user.standard.password=secret_sauce
user.locked.username=locked_out_user
user.locked.password=secret_sauce
user.problem.username=problem_user
user.problem.password=secret_sauce
user.performance.username=performance_glitch_user
user.performance.password=secret_sauce

# Checkout information
checkout.firstname=John
checkout.lastname=Doe
checkout.zipcode=12345

# Browser configuration
browser=chrome
browser.headless=false
browser.width=1920
browser.height=1080
browser.remote.url=

# WebDriver configuration
# Set to true to use local WebDriver binaries instead of WebDriverManager
webdriver.use.local=false

# Local WebDriver paths (only used if webdriver.use.local=true)
# Windows example: C:/drivers/chromedriver.exe
# Linux/Mac example: /usr/local/bin/chromedriver
webdriver.chrome.driver=
webdriver.firefox.driver=
webdriver.edge.driver=

# Timeout settings (milliseconds)
timeout.page.load=30000
timeout.implicit=10000
timeout.explicit=10000

# Thread configuration
thread.count=1

# Screenshots
screenshot.on.failure=true
screenshot.folder=target/screenshots

# Logging
logging.detailed=false

# Retry configuration
retry.attempts=0
