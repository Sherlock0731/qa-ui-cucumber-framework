# JUnit Platform Configuration for Cucumber Parallel Execution
# This file controls parallel execution at the JUnit Platform level

# Disable parallel execution by default (enabled via profiles or system properties)
cucumber.execution.parallel.enabled=false

# Parallel execution strategy
cucumber.execution.parallel.config.strategy=fixed

# Number of parallel threads (will be overridden by -Dcucumber.execution.parallel.config.fixed.parallelism)
cucumber.execution.parallel.config.fixed.parallelism=4

# Maximum pool size
cucumber.execution.parallel.config.fixed.max-pool-size=4

# Execution mode for features and scenarios
cucumber.execution.parallel.mode.default=concurrent
cucumber.execution.parallel.mode.classes.default=concurrent

# JUnit Jupiter parallel execution
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
junit.jupiter.execution.parallel.config.fixed.max-pool-size=4
