name: UI Tests - Navigation

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to use'
        default: 'chrome'
        type: choice
        options: ['chrome','firefox']

jobs:
  test-navigation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          # Firefox через Mozilla PPA с pin-приоритетом (иначе apt выбирает snap-обёртку из Ubuntu noble)
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg \
            -O- | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] \
            https://packages.mozilla.org/apt mozilla main" \
            | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          echo -e "Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000" \
            | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
          sudo apt-get update
          sudo apt-get install -y firefox

      - name: Checkout gh-pages (Allure history)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Backup Allure history to temp
        run: |
          mkdir -p /tmp/allure-history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/* /tmp/allure-history/
          fi

      - name: Create Allure environment info in temp
        run: |
          mkdir -p /tmp/allure-env
          cat > /tmp/allure-env/environment.properties << EOFINNER
          Browser=${{ github.event.inputs.browser || 'chrome' }}
          Browser.Version=stable
          Environment=CI
          Platform=ubuntu-latest
          Java.Version=17
          Framework=Cucumber BDD
          Test.Suite=Navigation
          
          Workflow=${{ github.workflow }}
          Run.Number=${{ github.run_number }}
          Triggered.By=${{ github.actor }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Repository=${{ github.repository }}
          EOFINNER
          echo "✅ Created environment.properties"

      - name: Run Navigation tests
        env:
          SAUCEDEMO_BASE_URL: ${{ secrets.SAUCEDEMO_BASE_URL }}
          USER_STANDARD_USERNAME: ${{ secrets.USER_STANDARD_USERNAME }}
          USER_STANDARD_PASSWORD: ${{ secrets.USER_STANDARD_PASSWORD }}

        run: |
          mvn clean test \
            -Denv=ci \
            -Dbrowser=${{ github.event.inputs.browser || 'chrome' }} \
            -Dheadless=true \
            -Dcucumber.filter.tags="@navigation" \
            -Dallure.results.directory=target/allure-results

      - name: Restore environment.properties
        if: always()
        run: |
          mkdir -p target/allure-results
          cp /tmp/allure-env/environment.properties target/allure-results/
          echo "✅ Restored environment.properties"

      - name: Create Allure executor info
        if: always()
        run: |
          cat > target/allure-results/executor.json << EOFINNER
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "${{ github.workflow }} #${{ github.run_number }}",
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildOrder": ${{ github.run_number }},
            "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          }
          EOFINNER

      - name: Restore Allure history
        if: always()
        run: |
          mkdir -p target/allure-results/history
          if [ -d /tmp/allure-history ]; then
            cp -r /tmp/allure-history/* target/allure-results/history/ 2>/dev/null || true
          fi

      - name: Verify files
        if: always()
        run: |
          echo "Files:"
          ls -lah target/allure-results/ | grep -E "environment|executor"
          cat target/allure-results/environment.properties

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Deploy Allure report
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site/allure-maven-plugin
          keep_files: false

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-navigation
          path: target/allure-results
          retention-days: 30
